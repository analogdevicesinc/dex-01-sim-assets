name: Documentation

on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    env:
      ADOC_DOC_VERSION: ${{ github.event_name == 'pull_request' && format('pull/{0}', github.event.number) || github.ref_name }}
      DOCS_SOURCE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      DOCS_PREVIEW: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt pytest
      - name: Verify versioned publishing behavior
        run: python -m pytest tests/test_documentation_publishing.py -q
      - name: Build documentation
        run: make -C docs html
      - name: Build historical prerelease from tagged sources
        if: github.ref == 'refs/heads/main'
        env:
          ADOC_DOC_VERSION: v0.1.0-a.1
        run: |
          python scripts/build_historical_docs.py
      - uses: actions/upload-artifact@v4
        with:
          name: html
          path: docs/_build/html
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: historical
          path: docs/_build/historical
          retention-days: 14

  deploy:
    name: Publish documentation
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'analogdevicesinc/dex-01-sim-assets' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    concurrency:
      group: documentation-gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: workflow
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: ./workflow/.github/actions/documentation-site
        with:
          version: ${{ github.event_name == 'pull_request' && format('pull/{0}', github.event.number) || github.ref_name }}
          historical: ${{ github.ref == 'refs/heads/main' }}
      - name: Upload the complete versioned site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site-artifact
      - name: Deploy GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
      - name: Link the published documentation
        env:
          SITE_URL: ${{ steps.pages.outputs.page_url }}
          DOC_VERSION: ${{ github.event_name == 'pull_request' && format('pull/{0}', github.event.number) || github.ref_name }}
        run: |
          url="${SITE_URL%/}/$DOC_VERSION/"
          printf '### Documentation\n\n[Open the documentation](%s)\n' "$url" >> "$GITHUB_STEP_SUMMARY"
