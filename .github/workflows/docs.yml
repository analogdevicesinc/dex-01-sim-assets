name: Documentation

on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    env:
      ADOC_DOC_VERSION: ${{ github.event_name == 'pull_request' && format('pull/{0}', github.event.number) || github.ref_name }}
      DOCS_SOURCE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      DOCS_PREVIEW: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Build documentation
        run: make -C docs html
      - name: Build historical prerelease from tagged sources
        if: github.ref == 'refs/heads/main'
        env:
          ADOC_DOC_VERSION: v0.1.0-a.1
        run: |
          python scripts/build_historical_docs.py
          python - <<'PY'
          import shutil
          shutil.copytree("docs/_build/historical", "docs/_build/html/v0.1.0-a.1", dirs_exist_ok=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: html
          path: docs/_build/html
          retention-days: 14

  deploy:
    name: Publish documentation
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'analogdevicesinc/dex-01-sim-assets' &&
      (github.event_name == 'push' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        vars.DOCS_PR_PREVIEWS_ENABLED == 'true' &&
        contains(github.event.pull_request.labels.*.name, 'documentation-preview')))
    concurrency:
      group: documentation-gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      # ADI's publisher preserves version directories and generates tags.json.
      # The main artifact already includes the immutable historical prerelease.
      - name: Check whether the preview is still open
        id: eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          publish=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            eligible=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '(.state == "open") and any(.labels[]; .name == "documentation-preview")')
            [[ "$eligible" == true ]] || publish=false
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Publish main, release, or same-repository PR preview
        if: steps.eligibility.outputs.publish == 'true'
        uses: analogdevicesinc/doctools/gh-pages-deploy@16221a9772561a2ad885314a339a1fb3208a4fa7
        with:
          name: html
          new_tag: ${{ github.ref_type == 'tag' }}
          tag: ${{ github.ref_name }}
      - name: Label documentation versions
        if: steps.eligibility.outputs.publish == 'true'
        run: |
          python - <<'PYVERSIONS'
          import json, re
          from pathlib import Path
          path = Path("tags.json")
          keys = json.loads(path.read_text())
          labels = {}
          if "" in keys and Path("index.html").exists():
              current = re.search(r'<meta name="version" content="([^"]*)"', Path("index.html").read_text())[1]
              labels[""] = [current, "development" if current == "main" else "current"]
          for key in keys:
              if not key:
                  continue
              if key.startswith("pull/"):
                  labels[key] = [f"PR #{key.split('/')[1]}", "preview"]
              else:
                  labels[key] = [key, "prerelease" if re.search(r"(?:-|[ab]|rc)", key) else "release"]
          path.write_text(json.dumps(labels, indent=2) + "\n")
          PYVERSIONS
      - name: Recheck the preview before deployment
        id: ready
        if: steps.eligibility.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          publish=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            eligible=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '(.state == "open") and any(.labels[]; .name == "documentation-preview")')
            [[ "$eligible" == true ]] || publish=false
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Upload the complete versioned site
        if: steps.ready.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy GitHub Pages
        if: steps.ready.outputs.publish == 'true'
        id: pages
        uses: actions/deploy-pages@v4
