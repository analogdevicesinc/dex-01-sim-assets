name: Remove documentation preview

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'analogdevicesinc/dex-01-sim-assets' &&
      github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: documentation-gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: workflow
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: ./workflow/.github/actions/documentation-site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site-artifact
      - uses: actions/deploy-pages@v4
        id: pages
