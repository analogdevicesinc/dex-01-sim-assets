name: Remove documentation preview

on:
  pull_request:
    types: [closed, unlabeled]

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'analogdevicesinc/dex-01-sim-assets' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.DOCS_PR_PREVIEWS_ENABLED == 'true' &&
      ((github.event.action == 'closed' &&
        contains(github.event.pull_request.labels.*.name, 'documentation-preview')) ||
       (github.event.action == 'unlabeled' && github.event.label.name == 'documentation-preview'))
    concurrency:
      group: documentation-gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: analogdevicesinc/doctools/gh-pages-rm-path@16221a9772561a2ad885314a339a1fb3208a4fa7
        with:
          path: pull/${{ github.event.number }}
      - name: Label documentation versions
        if: env.gh_pages_exist == 'true'
        run: |
          python - <<'PYVERSIONS'
          import json, re
          from pathlib import Path
          path = Path("tags.json")
          keys = json.loads(path.read_text())
          labels = {}
          if "" in keys and Path("index.html").exists():
              current = re.search(r'<meta name="version" content="([^"]*)"', Path("index.html").read_text())[1]
              labels[""] = [current, "development" if current == "main" else "current"]
          for key in keys:
              if not key:
                  continue
              if key.startswith("pull/"):
                  labels[key] = [f"PR #{key.split('/')[1]}", "preview"]
              else:
                  labels[key] = [key, "prerelease" if re.search(r"(?:-|[ab]|rc)", key) else "release"]
          path.write_text(json.dumps(labels, indent=2) + "\n")
          PYVERSIONS
      - uses: actions/upload-pages-artifact@v4
        if: env.gh_pages_exist == 'true'
        with:
          path: .
      - uses: actions/deploy-pages@v4
        if: env.gh_pages_exist == 'true'
        id: pages
