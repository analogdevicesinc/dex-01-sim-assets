name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify license documents
        run: |
          for package in common/source/dex01_sim_common physx/source/dex01_sim_asset newton/source/dex01_sim_newton; do
            for license_file in LICENSE NOTICE LICENSE_Tesollo; do
              cmp "$license_file" "$package/$license_file"
            done
          done
      - uses: pre-commit/action@v3.0.1

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch taxel pattern and DEX-01 reference geometry from LFS
        run: git lfs pull --include="common/**/*.npz,assets/sensors/dex01/*.obj,assets/robots/tesollo/*.usda"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest matplotlib trimesh scipy rtree pillow imageio-ffmpeg usd-core==26.8 build "setuptools>=77" wheel toml
          python -m pip install -r docs/requirements.txt
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        run: python -m pytest -q
