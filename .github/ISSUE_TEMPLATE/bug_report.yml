name: Bug report
description: Report a problem running or using the DEX-01 simulation asset
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, check the troubleshooting notes at the end of the README
        (`git lfs pull`, `egl-probe` build, streaming ports, import order).
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: What you expected and what you observed instead.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command line that reproduces the problem.
      render: bash
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS and version, Isaac Sim and Isaac Lab versions, Python version, GPU model and driver version.
      placeholder: |
        OS: Ubuntu 22.04
        Isaac Sim: 5.1.0, Isaac Lab: <commit or version>
        Python: 3.11.x
        GPU / driver: RTX 4090 / 560.xx
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Final error lines
      description: The last lines of the console output, including the traceback.
      render: text
    validations:
      required: true
