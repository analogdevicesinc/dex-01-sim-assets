<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
  <title id="title">Live viewing and recording of tactile simulation</title>
  <desc id="desc">An Isaac Sim host sends its viewport and tactile overlay over WebRTC to a laptop. A separate offscreen camera records a video with tactile frames composed by the recorder.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0067b9"/></marker></defs>
  <rect width="1040" height="520" rx="16" fill="#f4f7fa"/>
  <g font-family="Arial, sans-serif" fill="#17324d">
    <text x="40" y="46" font-size="26" font-weight="bold">One simulation, two ways to see it</text>
    <rect x="40" y="78" width="370" height="180" rx="14" fill="white" stroke="#b6c9d9" stroke-width="2"/>
    <text x="65" y="115" font-size="21" font-weight="bold">Simulation host</text>
    <text x="65" y="148" font-size="18">Isaac Sim + DEX-01 sensors</text>
    <text x="65" y="181" font-size="18">Rendered hand / pad + tactile overlay</text>
    <text x="65" y="223" font-size="17" fill="#0067b9">Run with --livestream=2</text>
    <path d="M 425 167 H 600" stroke="#0067b9" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="463" y="143" font-size="19" font-weight="bold">WebRTC</text>
    <text x="455" y="201" font-size="15">TCP 49100</text>
    <text x="455" y="223" font-size="15">UDP 47998</text>
    <rect x="625" y="78" width="370" height="180" rx="14" fill="white" stroke="#b6c9d9" stroke-width="2"/>
    <text x="650" y="115" font-size="21" font-weight="bold">Your laptop</text>
    <text x="650" y="148" font-size="18">Isaac Sim WebRTC client</text>
    <text x="650" y="181" font-size="18">Connect to the host's reachable IP</text>
    <text x="650" y="223" font-size="17" fill="#00877a">Live viewport includes the heatmaps</text>
    <path d="M 225 273 V 310" stroke="#0067b9" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <rect x="40" y="333" width="370" height="145" rx="14" fill="white" stroke="#b6c9d9" stroke-width="2"/>
    <text x="65" y="369" font-size="21" font-weight="bold">Offscreen camera</text>
    <text x="65" y="404" font-size="17">--headless --enable_cameras --record</text>
    <text x="65" y="446" font-size="17">Camera pixels + sensor force arrays</text>
    <path d="M 425 405 H 600" stroke="#0067b9" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="450" y="382" font-size="17">Compose frames</text>
    <rect x="625" y="333" width="370" height="145" rx="14" fill="white" stroke="#b6c9d9" stroke-width="2"/>
    <text x="650" y="369" font-size="21" font-weight="bold">Recorded video</text>
    <text x="650" y="404" font-size="18">Saved under videos/</text>
    <text x="650" y="446" font-size="17">Recorder adds matching tactile frames</text>
  </g>
</svg>
