repos:
  - repo: https://github.com/python/black
    rev: 24.3.0
    hooks:
      - id: black
        args: ["--line-length", "120", "--unstable"]
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        additional_dependencies: [flake8-simplify, flake8-return]
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (python)
        args: ["--profile", "black", "--filter-files"]
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.15.1
    hooks:
      - id: pyupgrade
        args: ["--py311-plus"]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: debug-statements
      - id: check-added-large-files
        args: ["--maxkb=2000"]  # assets live in git-lfs, not in the object store
  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.6
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.1
    hooks:
      - id: insert-license
        files: \.(py|ya?ml)$
        exclude: ^source/dex01_sim_asset/dex01_sim_asset/tactile_sensor(_cfg)?\.py$
        args:
          # The header pins its own year, so the hook must not rewrite it.
          - --license-filepath
          - .github/LICENSE_HEADER.txt
      - id: insert-license
        name: Insert license in adapted Isaac Lab sources
        files: ^source/dex01_sim_asset/dex01_sim_asset/tactile_sensor(_cfg)?\.py$
        args:
          - --license-filepath
          - .github/LICENSE_HEADER_BSD.txt
