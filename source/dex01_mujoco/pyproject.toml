[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dex01_mujoco"
version = "0.1.0"
description = "DEX-01 tactile sensor simulation for MuJoCo"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["mujoco>=3.2", "numpy", "scipy", "matplotlib", "trimesh", "usd-core"]

[tool.setuptools]
packages = ["dex01_mujoco"]
